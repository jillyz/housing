  <!-- Flatpickr 民國年 -->
  <link rel="stylesheet" href="../assets/vendor/flatpickr-4.6.13-TW/flatpickr.min.css">
  <script src="../assets/vendor/flatpickr-4.6.13-TW/flatpickr.min.js"></script>
  <script src="../assets/vendor/flatpickr-4.6.13-TW/zh_tw.js"></script>
  <!-- Fancybox -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css">
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <!-- FullCalendar 大月曆 -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js'></script>

<body>
  <div class="container py-5">
    <p><i class="fa-solid fa-circle-chevron-left"></i> <a href="../_components.html" class="text-body">回組件表</a></p>
    <div class="bg-white rounded-3 mt-4 mb-5">
      <h4 class="p-5 border-bottom">燈箱</h4>
      <div class="p-5">
        <div class="d-grid gap-5">
            <!-- 單張圖片 -->
            <div class="item">
                <h5 class="mb-3">單張圖片</h5>
                <a data-fancybox data-caption="單張圖片範例"
                    href="https://images.unsplash.com/photo-1605774337664-7a846e9cdf17?q=80&w=1074&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1605774337664-7a846e9cdf17?q=80&w=300&auto=format&fit=crop"
                        width="200" height="150" alt="單張圖片" class="rounded">
                </a>
            </div>
        
            <!-- 圖片相簿 -->
            <div class="item">
                <h5 class="mb-3">圖片相簿</h5>
                <div class="d-flex flex-wrap gap-3">
                    <a data-fancybox="gallery" data-caption="相簿圖片 #1"
                        href="https://images.unsplash.com/photo-1580554430120-94cfcb3adf25?q=80&w=1470&auto=format&fit=crop">
                        <img src="https://images.unsplash.com/photo-1580554430120-94cfcb3adf25?q=80&w=300&auto=format&fit=crop"
                            width="200" height="150" alt="相簿圖片 #1" class="rounded">
                    </a>
                    <a data-fancybox="gallery" data-caption="相簿圖片 #2"
                        href="https://plus.unsplash.com/premium_photo-1681487208776-e308bfaa0539?q=80&w=1470&auto=format&fit=crop">
                        <img src="https://plus.unsplash.com/premium_photo-1681487208776-e308bfaa0539?q=80&w=300&auto=format&fit=crop"
                            width="200" height="150" alt="相簿圖片 #2" class="rounded">
                    </a>
                    <a data-fancybox="gallery" data-caption="相簿圖片 #3"
                        href="https://images.unsplash.com/photo-1721244654210-a505a99661e9?q=80&w=1452&auto=format&fit=crop">
                        <img src="https://images.unsplash.com/photo-1721244654210-a505a99661e9?q=80&w=300&auto=format&fit=crop"
                            width="200" height="150" alt="相簿圖片 #3" class="rounded">
                    </a>
                </div>
            </div>
        
            <!-- 隱藏圖片 + 按鈕觸發 -->
            <div class="item">
                <h5 class="mb-3">按鈕觸發相簿（含隱藏圖片）</h5>
                <button class="btn btn-primary" onclick="openFancyboxGallery('hidden-gallery')">
                    <i class="fa-regular fa-images" aria-hidden="true"></i> 顯示全部相片
                </button>
                <div style="display:none">
                    <a data-fancybox="hidden-gallery" data-caption="隱藏圖片 #1"
                        href="https://images.unsplash.com/photo-1605774337664-7a846e9cdf17?q=80&w=1074&auto=format&fit=crop">
                        <img src="https://images.unsplash.com/photo-1605774337664-7a846e9cdf17?q=80&w=300&auto=format&fit=crop" alt="隱藏圖片 #1">
                    </a>
                    <a data-fancybox="hidden-gallery" data-caption="隱藏圖片 #2"
                        href="https://images.unsplash.com/photo-1580554430120-94cfcb3adf25?q=80&w=1470&auto=format&fit=crop">
                        <img src="https://images.unsplash.com/photo-1580554430120-94cfcb3adf25?q=80&w=300&auto=format&fit=crop" alt="隱藏圖片 #2">
                    </a>
                    <a data-fancybox="hidden-gallery" data-caption="隱藏圖片 #3"
                        href="https://plus.unsplash.com/premium_photo-1681487208776-e308bfaa0539?q=80&w=1470&auto=format&fit=crop">
                        <img src="https://plus.unsplash.com/premium_photo-1681487208776-e308bfaa0539?q=80&w=300&auto=format&fit=crop" alt="隱藏圖片 #3">
                    </a>
                </div>
            </div>
        
            <!-- 封面縮圖 + 隱藏照片組 -->
            <div class="item">
                <h5 class="mb-3">封面縮圖開啟照片組</h5>
                <a data-fancybox="cover-gallery" data-caption="店鋪入口"
                    href="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1470&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=300&auto=format&fit=crop"
                        width="200" height="150" alt="封面縮圖" class="rounded">
                </a>
                <div style="display:none">
                    <a data-fancybox="cover-gallery" data-caption="客廳"
                        href="https://images.unsplash.com/photo-1605774337664-7a846e9cdf17?q=80&w=1074&auto=format&fit=crop">
                        <img src="https://images.unsplash.com/photo-1605774337664-7a846e9cdf17?q=80&w=300&auto=format&fit=crop" alt="客廳">
                    </a>
                    <a data-fancybox="cover-gallery" data-caption="臥室"
                        href="https://images.unsplash.com/photo-1580554430120-94cfcb3adf25?q=80&w=1470&auto=format&fit=crop">
                        <img src="https://images.unsplash.com/photo-1580554430120-94cfcb3adf25?q=80&w=300&auto=format&fit=crop" alt="臥室">
                    </a>
                    <a data-fancybox="cover-gallery" data-caption="衛浴"
                        href="https://plus.unsplash.com/premium_photo-1681487208776-e308bfaa0539?q=80&w=1470&auto=format&fit=crop">
                        <img src="https://plus.unsplash.com/premium_photo-1681487208776-e308bfaa0539?q=80&w=300&auto=format&fit=crop" alt="衛浴">
                    </a>
                    <a data-fancybox="cover-gallery" data-caption="平面圖"
                        href="https://images.unsplash.com/photo-1721244654210-a505a99661e9?q=80&w=1452&auto=format&fit=crop">
                        <img src="https://images.unsplash.com/photo-1721244654210-a505a99661e9?q=80&w=300&auto=format&fit=crop" alt="平面圖">
                    </a>
                </div>
            </div>
        
            <!-- HTML 內容 -->
            <div class="item">
                <h5 class="mb-3">HTML 內容</h5>
                <a class="btn btn-primary" data-fancybox data-src="#fancybox-html-content" data-type="inline">
                    <i class="fa-solid fa-eye"></i> 開啟 HTML 燈箱
                </a>
                <div id="fancybox-html-content" style="display:none; max-width:500px;">
                    <h4 class="mb-3">自訂 HTML 內容</h4>
                    <p>這是一個使用 Fancybox 顯示自訂 HTML 內容的範例。可放入任意的 HTML 結構，例如表單、說明文字等。</p>
                    <ul>
                        <li>支援圖片瀏覽</li>
                        <li>支援 HTML 內容</li>
                        <li>支援影片播放</li>
                        <li>支援手勢操作（滑動、縮放）</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <script>
            // 初始化 Fancybox
            Fancybox.bind('[data-fancybox]');
        
            // 按鈕觸發指定相簿
            function openFancyboxGallery(galleryName) {
                const items = document.querySelectorAll(`[data-fancybox="${galleryName}"]`);
                const gallery = Array.from(items).map(item => ({
                    src: item.getAttribute('href'),
                    type: 'image',
                    caption: item.getAttribute('data-caption') || '',
                }));
                Fancybox.show(gallery);
            }
        </script>
        
      </div>
    </div>
  </div>

  <!-- Modal -->
  
  <!-- JS -->
</body>

</html>
