<style>
* {box-sizing:border-box}
body {margin:0;min-height:100vh;color:#133e49;font-family:"Microsoft JhengHei",system-ui,sans-serif;background-color:#ecf3f3;background-image:radial-gradient(#97b5b655 .8px,transparent .9px);background-size:18px 18px}
header {background:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px max(5vw,calc((100vw - 1160px)/2));border-bottom:1px solid #c8dcda;gap:12px}
.agency {display:flex;align-items:center;gap:13px;font-size:1.14rem;letter-spacing:.055em}
.agency img {width:33px;height:43px;object-fit:contain}
header span {border-left:2px solid #49a49d;padding-left:12px;color:#48636a;font-size:.9rem}
main {display:grid;grid-template-columns:1.22fr 1fr;width:min(1160px,90%);margin:clamp(32px,7vh,90px) auto;border-radius:24px;overflow:hidden;background:white;box-shadow:0 22px 60px #15444b21}
.brand {position:relative;isolation:isolate;overflow:hidden;min-height:535px;padding:clamp(32px,4.5vw,70px);background:radial-gradient(ellipse at 100% 75%,#298b89,transparent 67%),linear-gradient(145deg,#103d53,#155963 70%)}
.brand::before {content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(#b2efdf0c 1px,transparent 1px),linear-gradient(90deg,#b2efdf0c 1px,transparent 1px);background-size:34px 34px}
.brand::after {content:"";position:absolute;bottom:9%;right:-19%;width:63%;aspect-ratio:1;border:1px solid #ace7de38;border-radius:50%;box-shadow:0 0 0 24px #92dec60b,0 0 0 55px #92dec607;z-index:-1}
h1 {position:relative;margin:0;color:#fff;font-size:clamp(30px,3.25vw,49px);line-height:1.46;letter-spacing:.035em}
h1::before {content:"";display:block;width:48px;height:4px;background:#76dfc6;margin-bottom:24px}
.city {display:block;width:100%;height:auto;position:absolute;bottom:0;left:0;color:#91d4c9}
.login {display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,4.7vw,74px)}
.icon {width:60px;height:60px;padding:13px;background:#e2f3ee;border:1px solid #b1dcd3;border-radius:17px;color:#17736f}
h2 {font-size:2rem;letter-spacing:.04em;margin:20px 0 8px}
.login p {color:#48646c;line-height:1.8;margin:0}
.login-link {display:flex;justify-content:space-between;align-items:center;margin:24px 0 34px;padding:15px 21px;background:#10656b;color:white;text-decoration:none;font-size:1.03rem;font-weight:bold;border-radius:10px;box-shadow:0 5px 12px #14575e22}
.login-link span {font-size:1.35rem}
.login-link:hover {background:#0b5159}
.login-link:focus-visible {outline:3px solid #177b93;outline-offset:4px}
aside {border-top:1px solid #ccdcda;padding-top:20px}
aside h2 {margin:0 0 6px;font-size:.95rem}
aside p {font-size:.9rem}
@media(max-width:800px){main{width:94%}.brand,.login{padding:30px}}
@media(max-width:660px){header{padding:12px 4%}.agency{gap:8px;font-size:1rem}header span{font-size:.78rem}main{grid-template-columns:1fr;margin:18px auto 28px;border-radius:16px}.brand{min-height:0;padding:28px 24px 80px}.city{height:76px}.login{padding:28px 24px}.icon{width:46px;height:46px;padding:9px}h2{font-size:1.6rem;margin-top:14px}.login-link{margin:16px 0 22px}}
</style>
</head>
